name: build
run-name: openframe-hamclock package build and release

# Builds the openframe-hamclock package (package/build.sh) and publishes it as a GitHub
# release, which install.sh (and, later, sprite's app store) installs from. The HamClock
# version is pinned in package/upstream.sh; the package version is <HamClock>-<year.month.N>
# (package/version.sh).

on:
  push:
    branches: [main]
    paths:
      - 'package/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-package
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0    # the version counts this month's commits

      # i386 programs run as they are on the x86-64 runner, so no emulation is needed. Docker's
      # default seccomp filter on the runner stops i386 programs looking up names, so the i386
      # containers run without it (as openframe-linux's crystalhd workflow).
      - name: Build the package
        run: |
          version=$(bash package/version.sh)
          echo "version=${version}" >> "$GITHUB_ENV"
          echo "Building openframe-hamclock ${version}"
          mkdir -p out
          docker run --rm --security-opt seccomp=unconfined --platform linux/386 -v "$PWD/package:/src:ro" -v "$PWD/out:/out" \
            i386/debian:trixie sh /src/build.sh /src "${version}" /out

      # On a clean Trixie, as a unit would get it: apt finds every dependency, nothing it pulls
      # in is Mesa (the OpenFrame has no use for it, and it's hundreds of MB), the manifest is
      # where sprite looks, and HamClock starts (without a display, -h prints its usage and
      # exits 1).
      - name: Test the package
        run: |
          . package/upstream.sh
          docker run --rm --security-opt seccomp=unconfined --platform linux/386 -v "$PWD/out:/out:ro" -e VERSION="$VERSION" \
            i386/debian:trixie sh -euxc '
            apt-get -qq --error-on=any update
            DEBIAN_FRONTEND=noninteractive apt-get -qq install -y /out/openframe-hamclock_*.deb > /dev/null
            ! ldd /usr/bin/hamclock | grep "not found"
            ! dpkg -l | grep -E "^ii +(libgbm1|mesa-|libllvm|libgl1|libegl1)"
            test -s /usr/share/sprite/apps/hamclock.app
            grep -q "^exec=/usr/bin/hamclock " /usr/share/sprite/apps/hamclock.app
            test ! -u /usr/bin/hamclock
            set +e; HOME=/tmp hamclock -h > /dev/null 2> usage.txt; rc=$?; set -e
            [ "$rc" -eq 1 ] && grep -q "^Version $VERSION$" usage.txt
            test -s /usr/share/doc/openframe-hamclock/copyright
          '

      # Each release carries the package twice: by version, and as openframe-hamclock_i386.deb,
      # which .../releases/latest/download/ always finds (install.sh uses it). The upstream
      # source zip goes with it, for the GPL-3.0 parts built in (wsServer).
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${version}"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag exists already: nothing to do"
            exit 0
          fi
          . package/upstream.sh
          cp "out/openframe-hamclock_${version}_i386.deb" out/openframe-hamclock_i386.deb
          (cd out && sha256sum openframe-hamclock_*.deb "$ZIP" > SHA256SUMS)
          notes="HamClock ${VERSION} for the OpenFrame (openhamclock/hamclock ${TAG}), built for its 800x480 screen.

          Install it with install.sh (see the README), or by hand:
          \`sudo apt install ./openframe-hamclock_${version}_i386.deb\`"
          gh release create "$tag" --title "openframe-hamclock ${version}" --notes "$notes" --latest \
            "out/openframe-hamclock_${version}_i386.deb" out/openframe-hamclock_i386.deb "out/${ZIP}" out/SHA256SUMS
